<template>
  <div class="wizard">
    <div class="wizard-header">
      <h2 class="wizard-title">{title}</h2>
      <p class="wizard-subtitle">{subtitle}</p>
    </div>

    <template if:true={errorMessage}>
      <div class="banner banner_error" role="alert">
        <lightning-icon icon-name="utility:error" size="x-small" variant="inverse" alternative-text="Error"></lightning-icon>
        <span>{errorMessage}</span>
      </div>
    </template>

    <template if:true={isUpload}>
      <div class="section">
        <p class="section-label">Contact</p>
        <lightning-record-picker
          label="Whose résumé is this?"
          placeholder="Search Contacts…"
          object-api-name="Contact"
          value={selectedContactId}
          onchange={handleContactChange}>
        </lightning-record-picker>
      </div>

      <div class="drop-zone">
        <lightning-icon icon-name="utility:upload" size="small" class="drop-icon" alternative-text="Upload"></lightning-icon>
        <p class="drop-primary">Click to browse or drag &amp; drop</p>
        <p class="drop-secondary">PDF, PNG, or JPG — one résumé at a time</p>
        <input type="file" class="file-input" accept=".pdf,.png,.jpg" onchange={handleFileChange} />
      </div>
      <template if:true={fileName}>
        <div class="file-chip">
          <lightning-icon icon-name="doctype:pdf" size="x-small" alternative-text="File"></lightning-icon>
          <span class="file-chip-name">{fileName}</span>
        </div>
      </template>
      <template if:true={isFieldMapLoading}>
        <div class="centered-state">
          <lightning-spinner alternative-text="Loading review configuration" size="small"></lightning-spinner>
          <p class="state-text">Loading review configuration…</p>
        </div>
      </template>
      <template if:true={isFieldMapError}>
        <div class="banner banner_error" role="alert">
          <lightning-icon icon-name="utility:error" size="x-small" variant="inverse" alternative-text="Error"></lightning-icon>
          <span>No supported review configuration could be loaded. Fix the Resume Field Map and refresh.</span>
        </div>
      </template>
      <lightning-button variant="brand" label="Upload &amp; Parse" onclick={handleUploadAndParse} disabled={uploadDisabled} class="full-width-btn"></lightning-button>
    </template>

    <template if:true={isParsing}>
      <div class="centered-state">
        <lightning-spinner alternative-text="Parsing résumé" size="medium"></lightning-spinner>
        <p class="state-text">Reading the résumé and extracting work history…</p>
      </div>
    </template>

    <template if:true={isPreview}>
      <template if:true={hasVisibleCandidateFields}>
        <div class="section">
          <p class="section-label">Candidate</p>
          <div class="grid-2">
            <template for:each={visibleCandidateFields} for:item="field">
              <div key={field.parseKey}>
                <template if:true={field.isPicklist}>
                  <lightning-combobox label={field.label} data-key={field.parseKey} value={field.value} options={field.options} disabled={field.disabled} onchange={handleCandidateChange}></lightning-combobox>
                </template>
                <template if:true={field.isCheckbox}>
                  <lightning-input type="checkbox" label={field.label} data-key={field.parseKey} checked={field.checked} disabled={field.disabled} onchange={handleCandidateChange}></lightning-input>
                </template>
                <template if:true={field.isTextarea}>
                  <lightning-textarea label={field.label} data-key={field.parseKey} value={field.value} disabled={field.disabled} onchange={handleCandidateChange}></lightning-textarea>
                </template>
                <template if:true={field.isInput}>
                  <lightning-input type={field.inputType} label={field.label} data-key={field.parseKey} value={field.value} disabled={field.disabled} onchange={handleCandidateChange}></lightning-input>
                </template>
              </div>
            </template>
          </div>
        </div>
      </template>

      <template if:true={hasVisibleRoleTableFields}>
        <div class="section">
          <p class="section-label">Parsed roles ({roleCount})</p>
          <!-- lightning-datatable owns the single continuous horizontal scroll surface. -->
          <lightning-datatable
            key-field="id"
            data={tableRows}
            columns={tableColumns}
            column-widths-mode="fixed"
            hide-checkbox-column
            onrowselection={handleRowSelect}
            aria-label="Parsed work experience fields"
            class="roles-table">
          </lightning-datatable>
        </div>
      </template>

      <template if:true={hasDrafts}>
        <div class="section">
          <div class="pager">
            <lightning-button-icon icon-name="utility:chevronleft" alternative-text="Previous role" disabled={atFirst} onclick={handlePrev}></lightning-button-icon>
            <span class="pager-label">{pagerLabel}</span>
            <lightning-button-icon icon-name="utility:chevronright" alternative-text="Next role" disabled={atLast} onclick={handleNext}></lightning-button-icon>
          </div>

          <div class="role-card">
            <template if:true={hasVisibleRoleFields}>
              <div class="grid-2">
                <template for:each={activeDraftFields} for:item="field">
                  <div key={field.parseKey}>
                    <template if:true={field.isPicklist}>
                      <lightning-combobox label={field.label} data-key={field.parseKey} value={field.value} options={field.options} disabled={field.disabled} onchange={handleDraftChange}></lightning-combobox>
                    </template>
                    <template if:true={field.isCheckbox}>
                      <lightning-input type="checkbox" label={field.label} data-key={field.parseKey} checked={field.checked} disabled={field.disabled} onchange={handleDraftChange}></lightning-input>
                    </template>
                    <template if:true={field.isTextarea}>
                      <lightning-textarea label={field.label} data-key={field.parseKey} value={field.value} disabled={field.disabled} onchange={handleDraftChange}></lightning-textarea>
                    </template>
                    <template if:true={field.isInput}>
                      <lightning-input type={field.inputType} label={field.label} data-key={field.parseKey} value={field.value} disabled={field.disabled} onchange={handleDraftChange}></lightning-input>
                    </template>
                  </div>
                </template>
              </div>
            </template>
            <div class="role-actions">
              <lightning-button variant="destructive-text" label="Remove this role" icon-name="utility:delete" onclick={handleRemoveRole}></lightning-button>
            </div>
          </div>
        </div>
      </template>

      <div class="footer-actions">
        <lightning-button variant="neutral" label="Re-upload" onclick={handleReset}></lightning-button>
        <lightning-button variant="brand" label={confirmLabel} icon-name="utility:save" onclick={handleConfirm}></lightning-button>
      </div>
    </template>

    <template if:true={isCommitting}>
      <div class="centered-state">
        <lightning-spinner alternative-text="Saving" size="medium"></lightning-spinner>
        <p class="state-text">Saving work experience records…</p>
      </div>
    </template>

    <template if:true={isError}>
      <div class="centered-state">
        <p class="state-text">No work-experience roles were found. Try another file or check the résumé format.</p>
        <lightning-button variant="neutral" label="Re-upload" onclick={handleReset} class="full-width-btn"></lightning-button>
      </div>
    </template>

    <template if:true={isDone}>
      <div class="banner banner_success" role="status">
        <lightning-icon icon-name="utility:success" size="x-small" variant="inverse" alternative-text="Success"></lightning-icon>
        <span>{doneMessage}</span>
      </div>
      <lightning-button variant="neutral" label="Parse another résumé" onclick={handleReset} class="full-width-btn"></lightning-button>
    </template>

    <template if:true={hasFieldMap}>
      <div class="section fieldmap">
        <button type="button" class="fieldmap-toggle" onclick={handleToggleFieldMap} aria-expanded={showFieldMap}>
          <lightning-icon icon-name={fieldMapToggleIcon} size="xx-small" class="fieldmap-caret" alternative-text="Toggle field mapping"></lightning-icon>
          <span>{fieldMapToggleLabel}</span>
        </button>
        <template if:true={showFieldMap}>
          <p class="fieldmap-hint">Active candidate and role mappings are limited to direct fields on Resume Data and Work Experience. Invalid rows are shown here but ignored by prompt, review, and save.</p>
          <div class="fieldmap-table-scroll" role="region" aria-label="Resume field mapping" tabindex="0">
            <table class="fieldmap-table">
              <colgroup>
                <col class="fieldmap-col-key" />
                <col class="fieldmap-col-target" />
                <col class="fieldmap-col-type" />
                <col class="fieldmap-col-access" />
              </colgroup>
              <thead>
                <tr>
                  <th scope="col">Parse Key</th>
                  <th scope="col">Target</th>
                  <th scope="col">Type</th>
                  <th scope="col">Access</th>
                </tr>
              </thead>
              <tbody>
                <template for:each={fieldMapRows} for:item="row">
                  <tr key={row.id}>
                    <td class="fieldmap-key"><code>{row.parseKey}</code></td>
                    <td class="fieldmap-target">{row.target}</td>
                    <td class="fieldmap-type">{row.type}</td>
                    <td class="fieldmap-access"><span class="fieldmap-status">{row.access}</span></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
      </div>
    </template>
  </div>
</template>
